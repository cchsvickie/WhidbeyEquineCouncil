# Copies APPROVED events from the Airtable "Events" table into data/events.json,
# about once an hour. Commits only when something changed.
# Needs a repository secret named AIRTABLE_TOKEN (Settings > Secrets and variables > Actions).
# Without the secret it does nothing.
name: Sync events from Airtable

on:
  schedule:
    - cron: "17 * * * *"   # every hour (GitHub may run it a few minutes late)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read approved events from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python3 scripts/sync_events_from_airtable.py

      - name: Commit data/events.json if it changed (main branch only)
        id: commit
        run: |
          if git diff --quiet -- data/events.json; then
            echo "No changes to commit."
            exit 0
          fi
          git diff -- data/events.json
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Not on main (${GITHUB_REF}); showing the change above but not committing."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "Update events from Airtable"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Ask GitHub Pages to rebuild the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages rebuild request failed; the next push will rebuild."
